<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexChain AI | Neural Command (Offline)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg: #020617; --card: #0f172a; --primary: #6366f1; --text: #ffffff;
            --muted: #94a3b8; --border: rgba(255, 255, 255, 0.08);
            --neural-gold: #eab308; --danger: #ef4444; --success: #22c55e;
            --ai-glow: rgba(99, 102, 241, 0.4);
        }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .dashboard-wrapper { display: flex; width: 100vw; height: 100vh; }
        
        .sidebar { width: 260px; background: #0b0f1a; border-right: 1px solid var(--border); padding: 40px 20px; display: flex; flex-direction: column; flex-shrink: 0; }
        .logo { font-size: 22px; font-weight: 800; margin-bottom: 40px; letter-spacing: -1px; display: flex; align-items: center; gap: 8px;}
        .logo span { color: var(--primary); text-shadow: 0 0 15px var(--ai-glow); }
        
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: var(--muted); cursor: pointer; border-radius: 12px; margin-bottom: 8px; transition: 0.3s; font-size: 14px; }
        .nav-item.active, .nav-item:hover { background: rgba(99, 102, 241, 0.1); color: var(--primary); }
        .logout-btn { margin-top: auto; color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); background: rgba(239, 68, 68, 0.05); }

        .content { flex: 1; padding: 30px 50px; overflow-y: auto; background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.03), transparent); }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .export-btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid var(--border); position: relative; }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, var(--primary), transparent); }

        .charts-container { display: grid; grid-template-columns: 1.8fr 1.2fr; gap: 20px; margin-bottom: 25px; }
        .chart-card { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid var(--border); min-height: 320px; }
        .canvas-container { position: relative; height: 240px; width: 100%; }

        .inventory-section { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: left; color: var(--muted); padding: 12px; font-size: 11px; text-transform: uppercase; }
        td { padding: 16px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
        .ai-badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; background: rgba(99, 102, 241, 0.1); color: var(--primary); font-family: 'JetBrains Mono'; }

        .ai-tool { background: #0f172a; border: 1px solid var(--border); padding: 25px; border-radius: 20px; margin-top: 25px; }
        .control-flex { display: flex; gap: 15px; align-items: center; margin-top: 15px; }
        .table-search-input { padding: 12px 16px; background: #1e293b; border: 1px solid var(--border); border-radius: 10px; color: white; outline: none; font-size: 14px; flex: 1; }
        select.table-search-input { flex: 0.5; cursor: pointer; }

        #toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; }
        .toast { background: #1e293b; color: white; padding: 14px 20px; border-radius: 10px; border-left: 4px solid var(--primary); margin-top: 10px; font-size: 13px; font-family: 'JetBrains Mono'; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="logo"><i data-lucide="brain-circuit"></i> NEXCHAIN<span>AI</span></div>
            <nav>
                <div class="nav-item active" onclick="switchView('Command Center')"><i data-lucide="terminal"></i> Command Center</div>
                <div class="nav-item" onclick="switchView('Inventory')"><i data-lucide="database"></i> Neural Assets</div>
                <div class="nav-item" onclick="switchView('Logistics')"><i data-lucide="network"></i> Global Neural Grid</div>
                <div class="nav-item" onclick="switchView('AI Insights')"><i data-lucide="cpu"></i> Predictive Core</div>
                <div class="nav-item logout-btn" onclick="terminateSession()">
                    <i data-lucide="log-out"></i> Terminate Session
                </div>
            </nav>
        </aside>

        <main class="content">
            <header>
                <div>
                    <h1 id="page-title" style="margin:0;">Command Center</h1>
                    <p id="page-desc" style="color:var(--muted); margin:5px 0 0 0; font-size: 13px; font-family: 'JetBrains Mono';">SYSTEM_STATUS: OFFLINE_MODE</p>
                </div>
                <button class="export-btn">Report Locked</button>
            </header>

            <div id="main-view">
                <section class="stats-grid" id="stats-container"></section>

                <div id="dynamic-content">
                    <div id="default-dashboard-view">
                        <section class="charts-container">
                            <div class="chart-card">
                                <h4 style="margin:0 0 20px 0; font-size: 12px; color: var(--muted); letter-spacing: 1px;">VOLATILITY_MATRIX</h4>
                                <div class="canvas-container"><canvas id="lineChart"></canvas></div>
                            </div>
                            <div class="chart-card">
                                <h4 style="margin:0 0 20px 0; font-size: 12px; color: var(--muted); letter-spacing: 1px;">RESOURCE_LOAD</h4>
                                <div class="canvas-container"><canvas id="doughnutChart"></canvas></div>
                            </div>
                        </section>

                        <section class="inventory-section">
                            <h3 id="table-title" style="margin:0 0 15px 0; font-size: 18px;">Probability Ledger (Demo)</h3>
                            <table>
                                <thead>
                                    <tr><th>NODE_ID</th><th>ASSET_TYPE</th><th>PREDICTED_QTY</th><th>RISK_SCORE</th><th>SYNC</th></tr>
                                </thead>
                                <tbody id="inventoryBody">
                                    <tr>
                                        <td style="font-family: 'JetBrains Mono'; color:var(--primary)">#AI-AAPL</td>
                                        <td><strong>Apple</strong></td>
                                        <td>150 Units</td>
                                        <td><span class="ai-badge">0.12</span></td>
                                        <td><span style="color:var(--muted)">LOCAL_CACHE</span></td>
                                    </tr>
                                </tbody>
                            </table>
                        </section>
                    </div>
                </div>
                
                <section class="ai-tool" id="ai-tool-container"></section>
            </div>
        </main>
    </div>

    <script>
        // MOCK DATA & FUNCTIONS (All API calls removed)
        let CURRENT_LOCATION = 'Lucknow';
        let myLineChart, myDoughnutChart;

        window.addNewAsset = () => {
            showToast("Sync disabled in Offline Mode. Connect API to enable.");
        };

        window.switchView = (view) => {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('page-title').innerText = view;
            updateStats();
        };

        window.terminateSession = () => {
            alert("Session Terminated locally.");
        };

        function updateStats() {
            const confidence = (98.2).toFixed(1);
            document.getElementById('stats-container').innerHTML = [
                {l: "AI Confidence", v: `${confidence}%`},
                {l: "Neural Hub", v: CURRENT_LOCATION},
                {l: "Market Value", v: "$214.50"},
                {l: "Node Sync", v: "Offline"}
            ].map(s => `<div class="stat-card"><div style="color:var(--muted); font-size:10px;">${s.l}</div><div style="font-size:20px; font-weight:700; margin-top:5px;">${s.v}</div></div>`).join('');
        }

        function showToast(msg) {
            const t = document.createElement('div'); t.className = 'toast'; t.innerText = `>> ${msg}`;
            document.getElementById('toast-container').appendChild(t); setTimeout(() => t.remove(), 3000);
        }
        
        window.onload = () => {
            const ctxL = document.getElementById('lineChart').getContext('2d');
            myLineChart = new Chart(ctxL, { 
                type: 'line', data: { labels: ['T-5', 'T-4', 'T-3', 'T-2', 'T-1', 'NOW'], datasets: [{ data: [30, 45, 35, 60, 40, 55], borderColor: '#6366f1', tension: 0.4, fill: true, backgroundColor: 'rgba(99, 102, 241, 0.05)' }] }, 
                options: { maintainAspectRatio: false, plugins: { legend: { display: false } } } 
            });
            const ctxD = document.getElementById('doughnutChart').getContext('2d');
            myDoughnutChart = new Chart(ctxD, { 
                type: 'doughnut', data: { labels: ['AI', 'Data', 'Flux'], datasets: [{ data: [60, 25, 15], backgroundColor: ['#6366f1', '#eab308', '#f43f5e'], borderWidth: 0 }] }, 
                options: { maintainAspectRatio: false, cutout: '80%', plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8' } } } } 
            });
            updateStats();
            lucide.createIcons();
        };
    </script>
</body>
</html>
